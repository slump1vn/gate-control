name: Build Gate Controller Firmware

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'gate-controller/**'
      - '.github/workflows/gate-controller-build.yml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'gate-controller/**'
      - '.github/workflows/gate-controller-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gate-controller
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            gate-controller/.pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('gate-controller/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Host tests (signature, nonce, interlock, rate limit, RF frames)
        run: pio test -e native

      - name: Build firmware
        env:
          GATE_FW_BUILD_FLAGS: -DGATE_FW_VERSION=\"rf-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}\"
        run: pio run -e esp32s3

      - name: Collect firmware
        run: |
          mkdir -p dist
          cp .pio/build/esp32s3/firmware.bin dist/gate-controller-esp32s3.bin
          cp .pio/build/esp32s3/bootloader.bin dist/bootloader.bin
          cp .pio/build/esp32s3/partitions.bin dist/partitions.bin
          sha256sum dist/*.bin > dist/SHA256SUMS

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: gate-controller-esp32s3
          path: gate-controller/dist/
          retention-days: 90
