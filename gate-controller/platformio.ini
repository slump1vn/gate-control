; Gate controller: ESP32 + CC1101 433 MHz, speaking the gate controller
; contract v2 (see README.md and openspec/changes/2026-09-28-esp32-rf-gate-controller).
;
;   pio run -e esp32s3                 build for ESP32-S3-DevKitC-1
;   pio run -e esp32dev                build for ESP-WROOM-32 DevKit (30-pin)
;   pio run -e esp32dev -t upload      flash over USB
;   pio test -e native                 host tests of lib/gatecore

[platformio]
default_envs = esp32s3, esp32dev

[env]
test_framework = unity

; Shared by every ESP32 board
[esp32]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
  lsatan/SmartRC-CC1101-Driver-Lib@^2.5.7
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=1
  ; Set by CI from the git commit: -DGATE_FW_VERSION=\"rf-abc1234\"
  ${sysenv.GATE_FW_BUILD_FLAGS}
build_unflags = -std=gnu++11
; The host tests cover lib/gatecore; nothing runs on the device under `pio test`
test_ignore = *

[env:esp32s3]
extends = esp32
board = esp32-s3-devkitc-1
build_flags =
  ${esp32.build_flags}
  ; Logs over the S3's native USB port
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32dev]
extends = esp32
board = esp32dev
build_flags =
  ${esp32.build_flags}
  -DGATE_BOARD_ESP32DEV

[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
