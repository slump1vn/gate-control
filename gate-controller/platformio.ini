; Gate controller: ESP32-S3 + CC1101 433 MHz, speaking the gate controller
; contract v2 (see README.md and openspec/changes/2026-09-28-esp32-rf-gate-controller).
;
;   pio run -e esp32s3                 build the firmware
;   pio run -e esp32s3 -t upload       flash over USB
;   pio test -e native                 host tests of lib/gatecore

[platformio]
default_envs = esp32s3

[env]
test_framework = unity

[env:esp32s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  lsatan/SmartRC-CC1101-Driver-Lib@^2.5.7
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=1
  ; Logs over the S3's native USB port
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Set by CI from the git commit: -DGATE_FW_VERSION=\"rf-abc1234\"
  ${sysenv.GATE_FW_BUILD_FLAGS}
build_unflags = -std=gnu++11
; The host tests cover lib/gatecore; nothing runs on the device under `pio test`
test_ignore = *

[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
